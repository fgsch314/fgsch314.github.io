:root{--bg:#05091a;--surf:#0d1530;--surf2:#1a2545;--bord:#2a3a60;--txt:#e2e8f0;--muted:#94a3b8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* ── HEADER ── */
#hdr{padding:10px 18px;background:var(--surf);border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:18px;flex-shrink:0;flex-wrap:wrap;}
#hdr h1{font-family:'Playfair Display',serif;font-size:14px;font-weight:600;white-space:nowrap;}
#hdr .auth{font-size:10px;color:var(--muted);white-space:nowrap;}
#legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.li{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);}
.ll{display:flex;align-items:center;gap:3px;}
.lline{height:1.5px;width:22px;}
.lline.neg{background:#ef4444;}
.lline.pos{background:#22c55e;}
.lline.pot{background:none;border-top:2px dashed #ef4444;width:22px;}
.larr{width:0;height:0;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;}
.larr.neg{border-left:6px solid #ef4444;}
.larr.pos{border-left:6px solid #22c55e;}
.larr.pot{border-left:6px solid #ef4444;opacity:0.6;}
#toolbar{margin-left:auto;display:flex;gap:7px;align-items:center;}
.eb{background:var(--surf2);border:1px solid var(--bord);color:var(--txt);padding:4px 9px;border-radius:5px;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;transition:background .15s;}
.eb:hover{background:#243560;}

/* ── CHART ── */
#chart{flex:1;position:relative;overflow:hidden;}
#chart svg{width:100%;height:100%;cursor:grab;}
#chart svg:active{cursor:grabbing;}

/* ── TOOLTIP ── */
#tt{position:absolute;background:rgba(13,21,48,0.97);border:1px solid var(--bord);border-radius:8px;padding:10px 13px;max-width:260px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:100;}
#tt.show{opacity:1;}
#tt .ti{font-size:9.5px;color:#60a5fa;font-weight:600;letter-spacing:.06em;margin-bottom:3px;}
#tt .tl{font-family:'Playfair Display',serif;font-size:13px;font-weight:600;color:#e2e8f0;margin-bottom:5px;line-height:1.3;}
#tt .td{font-size:11px;color:#94a3b8;line-height:1.5;}

/* ── CONTEXT MENU ── */

/* ── MODALS ── */

</style>

const bgG = defs.append('radialGradient').attr('id','bgG').attr('cx','50%').attr('cy','50%').attr('r','70%');
bgG.append('stop').attr('offset','0%').attr('stop-color','#0d1840');
bgG.append('stop').attr('offset','100%').attr('stop-color','#05091a');
svg.append('rect').attr('width','100%').attr('height','100%').attr('fill','url(#bgG)');

// Arrow markers — one per colour
function makeMarker(id, color) {
  defs.append('marker').attr('id',id)
    .attr('viewBox','0 -4 9 8').attr('refX',7).attr('refY',0)
    .attr('markerWidth',5.5).attr('markerHeight',5.5).attr('orient','auto')
    .append('path').attr('d','M0,-4L9,0L0,4').attr('fill',color);
}
makeMarker('arr-neg','#ef4444');
makeMarker('arr-pos','#22c55e');
makeMarker('arr-pot','rgba(239,68,68,0.55)');

// Glow filter
const flt = defs.append('filter').attr('id','glow').attr('x','-50%').attr('y','-50%').attr('width','200%').attr('height','200%');
flt.append('feGaussianBlur').attr('stdDeviation','6').attr('result','b');
const fm = flt.append('feMerge');
fm.append('feMergeNode').attr('in','b');
fm.append('feMergeNode').attr('in','SourceGraphic');

const mainG  = svg.append('g').attr('class','root');
const edgeG  = mainG.append('g').attr('id','edgeG');
const nodeG  = mainG.append('g').attr('id','nodeG');

let nodeMap = {};

function buildNodeMap() {
  nodeMap = {};
  NODES_DEF.forEach(n => { nodeMap[n.id] = n; });
}

// ── Edge path: clip to node perimeters + collision avoidance ──
function computePath(s, t) {
  const dx = t.x - s.x, dy = t.y - s.y;
  const len = Math.hypot(dx, dy);
  if (len < 2) return null;
  const ux = dx/len, uy = dy/len;

  // Clip start/end to node circumferences
  const x1 = s.x + s.r * ux,     y1 = s.y + s.r * uy;
  const x2 = t.x - (t.r+4) * ux, y2 = t.y - (t.r+4) * uy;

  // Check for intermediate nodes blocking the straight path
  let worstOverlap = 0, worstNode = null, worstTP = 0.5;
  for (const n of NODES_DEF) {
    if (n.id === s.id || n.id === t.id) continue;
    const ex = x2-x1, ey = y2-y1, elen2 = ex*ex + ey*ey;
    if (elen2 < 1) continue;
    const tp = Math.max(0.05, Math.min(0.95, ((n.x-x1)*ex + (n.y-y1)*ey) / elen2));
    const cx = x1 + tp*ex, cy = y1 + tp*ey;
    const dist = Math.hypot(n.x - cx, n.y - cy);
    const clearance = n.r + 7;
    if (dist < clearance) {
      const ov = clearance - dist;
      if (ov > worstOverlap) { worstOverlap = ov; worstNode = n; worstTP = tp; }
    }
  }

  if (!worstNode) {
    // No collision — straight line
    return `M${x1.toFixed(1)},${y1.toFixed(1)} L${x2.toFixed(1)},${y2.toFixed(1)}`;
  }

  // Route around blocking node using a quadratic bezier.
  // Compute control point so the bezier midpoint (t=0.5) clears the blocking node.
  // Bezier midpoint = 0.25*P0 + 0.5*CP + 0.25*P2 → CP = 2*mid - 0.5*(P0+P2)
  const perpX = -uy, perpY = ux;
  const bx = worstNode.x - (x1 + worstTP*(x2-x1));
  const by = worstNode.y - (y1 + worstTP*(y2-y1));
  const sign = (perpX*bx + perpY*by) >= 0 ? -1 : 1;
  const push  = worstOverlap + worstNode.r + 14;
  const midX  = (x1+x2)/2 + sign * perpX * push;
  const midY  = (y1+y2)/2 + sign * perpY * push;
  const cpX   = 2*midX - 0.5*(x1+x2);
  const cpY   = 2*midY - 0.5*(y1+y2);

  return `M${x1.toFixed(1)},${y1.toFixed(1)} Q${cpX.toFixed(1)},${cpY.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;
}

function drawEdges() {
  edgeG.selectAll('*').remove();
  EDGES.forEach((e, ei) => {
    const s = nodeMap[e.s], t = nodeMap[e.t];
    if (!s || !t) return;
    const d = computePath(s, t);
    if (!d) return;

    const isPot = e.type === 'pot';
    const isPos = e.type === 'pos';
    const col   = isPos ? '#22c55e' : '#ef4444';
    const op    = isPot ? 0.38 : (isPos ? 0.60 : 0.42);
    const sw    = isPos ? 1.2 : 1.3;

    edgeG.append('path')
      .attr('class','edge-path')
      .attr('data-ei', ei)
      .attr('d', d)
      .attr('fill','none')
      .attr('stroke', col)
      .attr('stroke-width', sw)
      .attr('stroke-opacity', op)
      .attr('stroke-dasharray', isPot ? '6 4' : 'none')
      .attr('marker-end', `url(#arr-${isPot ? 'pot' : (isPos ? 'pos' : 'neg')})`)
      .on('mouseenter', function() { d3.select(this).attr('stroke-opacity', Math.min(1, op*2.2)).attr('stroke-width', sw+0.7); })
      .on('mouseleave', function() { d3.select(this).attr('stroke-opacity', op).attr('stroke-width', sw); });
  });
}

function drawNodes() {
  nodeG.selectAll('*').remove();
  defs.selectAll('[id^="ng"]').remove();

  NODES_DEF.forEach(n => {
    const col = DCOL[n.dom] || '#7ea8e0';
    const hex = col.replace('#','');
    const r2 = parseInt(hex.substring(0,2),16);
    const g2 = parseInt(hex.substring(2,4),16);
    const b2 = parseInt(hex.substring(4,6),16);

    const gid = 'ng'+n.id;
    const gr = defs.append('radialGradient').attr('id',gid).attr('cx','38%').attr('cy','32%').attr('r','68%');
    gr.append('stop').attr('offset','0%').attr('stop-color',`rgba(${r2},${g2},${b2},0.38)`);
    gr.append('stop').attr('offset','100%').attr('stop-color',`rgba(${r2},${g2},${b2},0.08)`);

    const ng = nodeG.append('g')
      .attr('class','node-g')
      .attr('data-id', n.id)
      .attr('transform',`translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);

    // Soft aura
    ng.append('circle').attr('r', n.r+12).attr('fill',`rgba(${r2},${g2},${b2},0.04)`);

    // Main circle
    ng.append('circle')
      .attr('class','nc')
      .attr('r', n.r)
      .attr('fill',`url(#${gid})`)
      .attr('stroke', col)
      .attr('stroke-width', n.id==='ROOT' ? 2.5 : 1.4);

    // Extra rings for root node
    if (n.id === 'ROOT') {
      [16, 30].forEach((off, i) => {
        ng.append('circle').attr('r', n.r+off).attr('fill','none')
          .attr('stroke',col).attr('stroke-width',0.7).attr('stroke-opacity',0.14-i*0.04);
      });
    }

    // Label
    const lines = n.lbl.split('\n');
    const lh = 11, th = (lines.length-1) * lh;
    lines.forEach((line, i) => {
      ng.append('text')
        .attr('x',0).attr('y', -th/2 + i*lh + (lines.length > 1 ? 1 : 4))
        .attr('text-anchor','middle').attr('dominant-baseline','middle')
        .attr('fill','#fff')
        .attr('font-size', n.id==='ROOT' ? '13px' : (n.r >= 24 ? '9px' : '8px'))
        .attr('font-weight', n.id==='ROOT' ? '700' : '400')
        .attr('font-family', n.id==='ROOT' ? 'Playfair Display,serif' : 'DM Sans,sans-serif')
        .attr('pointer-events','none')
        .text(line);
    });

    // Interaction layer
    ng.append('circle').attr('r', n.r+11).attr('fill','transparent')
      .on('mouseenter', ev => { showTip(ev, n); highlightNode(n.id, true); })
      .on('mousemove',  ev => { moveTip(ev); })
      .on('mouseleave', ()  => { hideTip(); highlightNode(n.id, false); });
  });
}

// Highlight connected edges/nodes on hover
function highlightNode(id, on) {
  edgeG.selectAll('.edge-path').each(function(d, i) {
    const e = EDGES[+d3.select(this).attr('data-ei')];
    if (!e) return;
    const connected = (e.s === id || e.t === id);
    if (on && connected) {
      d3.select(this).attr('stroke-opacity', 0.9).attr('stroke-width', 2);
    } else if (on) {
      d3.select(this).attr('stroke-opacity', 0.08);
    } else {
      const isPot = e.type==='pot', isPos = e.type==='pos';
      d3.select(this)
        .attr('stroke-opacity', isPot ? 0.38 : (isPos ? 0.60 : 0.42))
        .attr('stroke-width', isPos ? 1.2 : 1.3);
    }
  });
}

function redraw() {
  buildNodeMap();
  drawEdges();
  drawNodes();
}

redraw();

// ── Zoom / Pan ──────────────────────────────────────────────────
const zoom = d3.zoom().scaleExtent([0.18, 5])
  .on('zoom', ev => {
    mainG.attr('transform', ev.transform);
  });
svg.call(zoom);

function fitView() {
  const w = svgEl.clientWidth || 1200, h = svgEl.clientHeight || 700, pad = 60;
  const xs = NODES_DEF.flatMap(n => [n.x - n.r, n.x + n.r]);
  const ys = NODES_DEF.flatMap(n => [n.y - n.r, n.y + n.r]);
  const x0 = Math.min(...xs)-pad, x1 = Math.max(...xs)+pad;
  const y0 = Math.min(...ys)-pad, y1 = Math.max(...ys)+pad;
  const sc = Math.min(w/(x1-x0), h/(y1-y0)) * 0.97;
  svg.transition().duration(450)
    .call(zoom.transform, d3.zoomIdentity
      .translate(w/2 - (x0+(x1-x0)/2)*sc, h/2 - (y0+(y1-y0)/2)*sc)
      .scale(sc));
}
document.getElementById('zi').onclick = () => svg.transition().call(zoom.scaleBy, 1.3);
document.getElementById('zo').onclick = () => svg.transition().call(zoom.scaleBy, 0.77);
document.getElementById('zr').onclick = fitView;
setTimeout(fitView, 80);
window.addEventListener('resize', fitView);

// ── Tooltip ─────────────────────────────────────────────────────
const ttEl = document.getElementById('tt');
function showTip(ev, n) {
  ttEl.innerHTML = `<div class="ti">${n.id}</div><div class="tl">${n.lbl.replace(/\n/g,' ')}</div><div class="td">${n.desc}</div>`;
  ttEl.classList.add('show'); moveTip(ev);
}
function moveTip(ev) {
  const tw = 265, pad = 16;
  let lx = ev.clientX + pad;
  if (lx + tw > window.innerWidth - 8) lx = ev.clientX - tw - pad;
  ttEl.style.left = lx + 'px'; ttEl.style.top = (ev.clientY - 14) + 'px';
}
function hideTip() { ttEl.classList.remove('show'); }
</script>
</body>
</html>
