<style>
:root{--bg:#05091a;--surf:#0d1530;--surf2:#1a2545;--bord:#2a3a60;--txt:#e2e8f0;--muted:#64748b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
#hdr{padding:10px 18px;background:var(--surf);border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:18px;flex-shrink:0;flex-wrap:wrap;}
#hdr h1{font-family:'Playfair Display',serif;font-size:14px;font-weight:600;white-space:nowrap;}
#hdr .auth{font-size:10px;color:var(--muted);white-space:nowrap;}
#legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.li{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);}
.ll{display:flex;align-items:center;gap:3px;}
.lline{height:1.5px;width:22px;}
.lline.neg{background:#ef4444;}.lline.pos{background:#22c55e;}
.lline.pot{background:none;border-top:2px dashed #ef4444;width:22px;}
.lline.back{background:none;border-top:2px dashed #06b6d4;width:22px;}
.larr{width:0;height:0;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;}
.larr.neg{border-left:6px solid #ef4444;}.larr.pos{border-left:6px solid #22c55e;}
.larr.pot{border-left:6px solid #ef4444;opacity:0.6;}
.larr.back{border-left:6px solid #06b6d4;}
#toolbar{margin-left:auto;display:flex;gap:7px;align-items:center;}
.eb{background:var(--surf2);border:1px solid var(--bord);color:var(--txt);padding:4px 9px;border-radius:5px;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;transition:background .15s;}
.eb:hover{background:#243560;}
#chart{flex:1;position:relative;overflow:hidden;}
#chart svg{width:100%;height:100%;cursor:grab;}
#chart svg:active{cursor:grabbing;}
#tt{position:absolute;background:rgba(5,9,26,0.97);border:1px solid var(--bord);border-radius:8px;padding:10px 13px;max-width:270px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:100;}
#tt.show{opacity:1;}
#tt .ti{font-size:9.5px;color:#7dd3fc;font-weight:600;letter-spacing:.06em;margin-bottom:3px;}
#tt .tl{font-family:'Playfair Display',serif;font-size:13px;font-weight:600;color:#e2e8f0;margin-bottom:5px;line-height:1.3;}
#tt .td{font-size:11px;color:#94a3b8;line-height:1.55;}
</style>

const NODES_DEF = [

  // ── L0 ROOT
  { id:'ROOT', x:1700, y:75, r:34, dom:'conflict', lbl:'War on\nIran',
    desc:'U.S.-Israeli campaign (Operations Epic Fury & Roaring Lion) launched 28 Feb 2026. Iran retaliated against all six GCC states simultaneously — unprecedented. Aramco CEO Amin Nasser warned of "catastrophic consequences": a severe chain reaction across shipping, aviation, agriculture and industry.' },

  // ── L1 PRIMARY SHOCKS (y=285)
  { id:'GS1', x:340,  y:285, r:26, dom:'shock', lbl:'Strait of\nHormuz Closure',
    desc:'Effectively closed from ~2 March. ~500 ships anchored in open Gulf waters; insurers cancelled war-risk coverage. ~20% of global oil, ~20% of LNG, ~16% of global fertiliser and ~40% of non-HC goods transits the Strait. Estimated cost to global economy: $3–5bn per day.' },
  { id:'GS2', x:940,  y:285, r:24, dom:'shock', lbl:'Airspace &\nAirport Closures',

  { id:'GS3', x:1700, y:285, r:26, dom:'shock', lbl:'Infrastructure\nStrikes',
    desc:'Iranian drones and missiles struck across all six GCC states: Ras Tanura, Ras Laffan, Ruwais, Fujairah, Jebel Ali, DIFC (twice), Burj Al Arab, AWS data centres (UAE and Bahrain), Bahrain desalination plant, Fifth Fleet HQ, Manama residential towers. UAE intercepted 1,500+ drones and 300+ missiles by 13 March.' },
  { id:'GS5', x:2480, y:285, r:22, dom:'shock', lbl:'Operational\nDefence\nCosts Surge',

  { id:'GS6', x:3100, y:285, r:22, dom:'shock', lbl:'US Security\nGuarantee\nUndermined',
    desc:'GCC received no advance warning. US pre-removed troops from Al Udeid before Iran\'s strike, leaving Qatar exposed. US bases attracted Iranian strikes rather than deterring them. GCC leaders publicly questioned Washington\'s judgment. Feeds long-term security diversification.' },

  // ── L2 DIRECT PHYSICAL IMPACTS (y=495)
  { id:'GE4',     x:120,  y:495, r:19, dom:'energy',   lbl:'Storage\nFills',
    desc:'Hormuz closure causes Gulf oil/gas storage to fill rapidly. Producers forced to cut output even with intact infrastructure — a self-reinforcing supply shock. Storage-driven cuts compound pipeline restrictions.' },
  { id:'GM3',     x:340,  y:495, r:18, dom:'logistics', lbl:'Red Sea\nBypass\nDisrupted',

  { id:'BYPASSES',x:570,  y:495, r:20, dom:'energy',   lbl:'Gulf Pipeline\nBypasses',

  { id:'IEARES',  x:790,  y:495, r:18, dom:'energy',   lbl:'IEA Strategic\nReserves\nRelease',

  { id:'GL1',     x:1030, y:495, r:21, dom:'logistics', lbl:'Logistics\nHubs Struck',

  { id:'HCIS',    x:1260, y:495, r:21, dom:'energy',   lbl:'Oil/gas Infra\nDestroyed',

  { id:'EPOW',    x:1490, y:495, r:18, dom:'infra',    lbl:'Power Plants\n& Grid Struck',

  { id:'TRIS',    x:1920, y:495, r:17, dom:'infra',    lbl:'Transport\nInfra Struck',

  { id:'GD1',     x:2340, y:495, r:19, dom:'tech',     lbl:'IT Infra\nStruck',

  { id:'GD3',     x:2530, y:495, r:16, dom:'tech',     lbl:'Communications\nInfra Struck',

  { id:'GF0',     x:2720, y:495, r:22, dom:'finance',  lbl:'Financial\nCentres\nStruck',

  { id:'GK4',     x:2980, y:495, r:18, dom:'defence',  lbl:'US Umbrella\nRethink',
    desc:'GCC states must weigh whether US forces are a net security asset or a liability attracting Iranian targeting. Long-term security diversification toward China, France, or multilateral frameworks accelerates. GCC must compensate for reduced US protection.' },

  { id:'GE2',  x:170,  y:705, r:22, dom:'energy',   lbl:'Oil/gas\nProduction\nHalted',

  { id:'GE3',  x:460,  y:705, r:19, dom:'energy',   lbl:'Oil/gas\nRestart\nDifficulties',

  { id:'GW3',  x:980,  y:705, r:20, dom:'water',    lbl:'Water Supply\nEmergency',

  { id:'GA1',  x:1800, y:705, r:22, dom:'aviation', lbl:'Gulf Airlines\nGrounded',

  { id:'GA4',  x:2060, y:705, r:18, dom:'aviation', lbl:'Rerouting &\nRepatriation\nFlights',

  { id:'GD2',  x:2750, y:705, r:18, dom:'tech',     lbl:'Digital Hub\nAmbitions\nThreatened',

  { id:'GH1',  x:3100, y:705, r:21, dom:'human',    lbl:'HNWI &\nExpatriates\nRelocate',

  { id:'TAIRL', x:1860, y:915, r:19, dom:'aviation', lbl:'Tourism &\nAirline\nIndustry Losses',

  { id:'LLOG',  x:2150, y:915, r:19, dom:'logistics', lbl:'Logistics\nIndustry\nLosses',

  { id:'GK3',   x:2750, y:915, r:19, dom:'defence',  lbl:'Domestic\nDefence Industry\nDevelopment',

  { id:'OILP',  x:160,  y:1125, r:20, dom:'finance',  lbl:'Oil Price\nShock',

  { id:'GK2',   x:2280, y:1125, r:18, dom:'defence',  lbl:'Financial\nPressure\non Visions',

  { id:'GA3',   x:2560, y:1125, r:18, dom:'aviation', lbl:'Long-term\nTourism\nDamage',

  { id:'GH3',   x:2840, y:1125, r:18, dom:'human',    lbl:'Long-term\nAttractiveness\nSuffers',

  { id:'GM_1',    x:660,  y:1545, r:20, dom:'macro', lbl:'Gulf\nInflation',

  { id:'GM_4',    x:2720, y:1545, r:20, dom:'macro', lbl:'Stagflation\nRisk',

// ── Edge path
function computePath(s, t) {
  const dx = t.x - s.x;
  const dy = t.y - s.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 2) return null;

  if (dy < -35) {
    // Backward (feedback) edge — arc above both nodes
    const ux = dx / dist, uy = dy / dist;
    const x1 = s.x + s.r * ux, y1 = s.y + s.r * uy;
    const x2 = t.x - (t.r + 3) * ux, y2 = t.y - (t.r + 3) * uy;
    const rise = 120 + Math.abs(dx) * 0.18;
    const midX = (x1 + x2) / 2;
    const midY = Math.min(s.y, t.y) - rise;
    return `M${x1.toFixed(1)},${y1.toFixed(1)} Q${midX.toFixed(1)},${midY.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;
  } else if (dy > 35) {
    // Downward flow — S-curve cubic bezier
    const x1 = s.x, y1 = s.y + s.r;
    const x2 = t.x, y2 = t.y - t.r - 3;
    const h = y2 - y1;
    const lateralPull = Math.min(0.35, Math.abs(dx) / Math.max(h, 1) * 0.6);
    const cp1x = x1 + dx * lateralPull;
    const cp1y = y1 + h * 0.44;
    const cp2x = x2 - dx * lateralPull;
    const cp2y = y2 - h * 0.44;
    return `M${x1.toFixed(1)},${y1.toFixed(1)} C${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;
  } else {
    // Lateral / same-layer — radial exit, arc drooping below
    const ux = dx / dist, uy = dy / dist;
    const x1 = s.x + s.r * ux, y1 = s.y + s.r * uy;
    const x2 = t.x - (t.r + 3) * ux, y2 = t.y - (t.r + 3) * uy;
    const drop = 55 + Math.abs(dx) * 0.12;
    const midX = (x1 + x2) / 2;
    const midY = Math.max(s.y, t.y) + drop;
    return `M${x1.toFixed(1)},${y1.toFixed(1)} Q${midX.toFixed(1)},${midY.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;
  }
}

function drawEdges() {
  edgeG.selectAll('*').remove();
  EDGES.forEach((e, ei) => {
    const s = nodeMap[e.s], t = nodeMap[e.t];
    if (!s || !t) return;
    const d = computePath(s, t);
    if (!d) return;

    const isBack = e.type === 'back';
    const isPot  = e.type === 'pot';
    const isPos  = e.type === 'pos';

    let col, op, sw, dash, marker;
    if (isBack) {
      col = '#06b6d4'; op = 0.60; sw = 1.3;
      dash = '7 4'; marker = 'arr-back';
    } else if (isPot) {
      col = '#ef4444'; op = 0.35; sw = 1.2;
      dash = '6 4'; marker = 'arr-pot';
    } else if (isPos) {
      col = '#22c55e'; op = 0.58; sw = 1.15;
      dash = 'none'; marker = 'arr-pos';
    } else {
      col = '#ef4444'; op = 0.38; sw = 1.25;
      dash = 'none'; marker = 'arr-neg';
    }

    edgeG.append('path')
      .attr('class','edge-path').attr('data-ei', ei)
      .attr('d', d).attr('fill','none').attr('stroke', col)
      .attr('stroke-width', sw).attr('stroke-opacity', op)
      .attr('stroke-dasharray', dash)
      .attr('marker-end', `url(#${marker})`)
      .on('mouseenter', function() {
        d3.select(this).attr('stroke-opacity', Math.min(1, op*2.5)).attr('stroke-width', sw+0.9);
      })
      .on('mouseleave', function() {
        d3.select(this).attr('stroke-opacity', op).attr('stroke-width', sw);
      });
  });
}

function drawNodes() {
  nodeG.selectAll('*').remove();
  defs.selectAll('[id^="ng"]').remove();

  NODES_DEF.forEach(n => {
    const col = DCOL[n.dom] || '#7ea8e0';
    const hex = col.replace('#','');
    const r2 = parseInt(hex.substring(0,2),16);
    const g2 = parseInt(hex.substring(2,4),16);
    const b2 = parseInt(hex.substring(4,6),16);

    const gid = 'ng'+n.id;
    const gr = defs.append('radialGradient').attr('id',gid).attr('cx','38%').attr('cy','32%').attr('r','68%');
    gr.append('stop').attr('offset','0%').attr('stop-color',`rgba(${r2},${g2},${b2},0.40)`);
    gr.append('stop').attr('offset','100%').attr('stop-color',`rgba(${r2},${g2},${b2},0.09)`);

    const ng = nodeG.append('g')
      .attr('class','node-g').attr('data-id', n.id)
      .attr('transform',`translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);

    ng.append('circle').attr('r', n.r+11).attr('fill',`rgba(${r2},${g2},${b2},0.04)`);

    ng.append('circle').attr('class','nc').attr('r', n.r)
      .attr('fill',`url(#${gid})`).attr('stroke', col)
      .attr('stroke-width', n.id==='ROOT' ? 2.5 : 1.4);

    if (n.id==='ROOT') {
      [16,30].forEach((off,i) => {
        ng.append('circle').attr('r', n.r+off).attr('fill','none')
          .attr('stroke',col).attr('stroke-width',0.7).attr('stroke-opacity',0.14-i*0.04);
      });
    }

    const lines = n.lbl.split('\n');
    const lh = 11, th = (lines.length-1)*lh;
    lines.forEach((line, i) => {
      ng.append('text')
        .attr('x',0).attr('y',-th/2+i*lh+(lines.length>1?1:4))
        .attr('text-anchor','middle').attr('dominant-baseline','middle')
        .attr('fill','#fff')
        .attr('font-size', n.id==='ROOT'?'13px':(n.r>=23?'9px':'8px'))
        .attr('font-weight', n.id==='ROOT'?'700':'400')
        .attr('font-family', n.id==='ROOT'?'Playfair Display,serif':'DM Sans,sans-serif')
        .attr('pointer-events','none').text(line);
    });

    ng.append('circle').attr('r', n.r+11).attr('fill','transparent')
      .on('mouseenter', ev => { showTip(ev, n); highlightNode(n.id, true); })
      .on('mousemove',  ev => { moveTip(ev); })
      .on('mouseleave', ()  => { hideTip(); highlightNode(n.id, false); });
  });
}

function highlightNode(id, on) {
  edgeG.selectAll('.edge-path').each(function() {
    const e = EDGES[+d3.select(this).attr('data-ei')];
    if (!e) return;
    const connected = (e.s===id || e.t===id);
    const isBack = e.type==='back', isPot=e.type==='pot', isPos=e.type==='pos';
    const baseOp = isBack ? 0.60 : isPot ? 0.35 : isPos ? 0.58 : 0.38;
    const baseSw = isBack ? 1.3 : isPos ? 1.15 : 1.25;
    if (on && connected) {
      d3.select(this).attr('stroke-opacity', 0.95).attr('stroke-width', baseSw+1.2);
    } else if (on) {
      d3.select(this).attr('stroke-opacity', 0.05);
    } else {
      d3.select(this).attr('stroke-opacity', baseOp).attr('stroke-width', baseSw);
    }
  });
}

function redraw() { buildNodeMap(); drawEdges(); drawNodes(); }

function fitView() {
  const w = svgEl.clientWidth || 1400, h = svgEl.clientHeight || 800, pad = 55;
  const xs = NODES_DEF.flatMap(n => [n.x-n.r, n.x+n.r]);
  const ys = NODES_DEF.flatMap(n => [n.y-n.r, n.y+n.r]);
  const x0=Math.min(...xs)-pad, x1=Math.max(...xs)+pad;
  const y0=Math.min(...ys)-pad, y1=Math.max(...ys)+pad;
  const sc=Math.min(w/(x1-x0), h/(y1-y0))*0.96;
  svg.transition().duration(450)
    .call(zoom.transform, d3.zoomIdentity
      .translate(w/2-(x0+(x1-x0)/2)*sc, h/2-(y0+(y1-y0)/2)*sc).scale(sc));
}

// ── Tooltip
const ttEl = document.getElementById('tt');
function showTip(ev, n) {
  ttEl.innerHTML=`<div class="ti">${n.id}</div><div class="tl">${n.lbl.replace(/\n/g,' ')}</div><div class="td">${n.desc}</div>`;
  ttEl.classList.add('show'); moveTip(ev);
}
function moveTip(ev) {
  const tw=270, pad=16;
  let lx=ev.clientX+pad;
  if(lx+tw>window.innerWidth-8) lx=ev.clientX-tw-pad;
  ttEl.style.left=lx+'px'; ttEl.style.top=(ev.clientY-14)+'px';
}
function hideTip(){ttEl.classList.remove('show');}
