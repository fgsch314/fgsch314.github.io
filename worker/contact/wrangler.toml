# Cloudflare Worker for the website contact form. Deploy: `npx wrangler deploy` from this folder.
# Prerequisites (see README.md): Resend account with forms.fredericgschneider.com verified;
# secrets set with `npx wrangler secret put TURNSTILE_SECRET` and `npx wrangler secret put RESEND_API_KEY`.
name = "contact-form"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
FROM_ADDRESS = "website@forms.fredericgschneider.com"
TO_ADDRESS = "frederic@fredericgschneider.com"
ALLOWED_ORIGINS = "https://fredericgschneider.com,https://www.fredericgschneider.com,https://fgsch314.github.io,http://localhost:8740"
