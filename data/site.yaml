# Site-wide settings and the hand-curated bits (bio, charts). Outputs live in outputs.yaml.
name: Frédéric-Guillaume Schneider
short_name: Frédéric Schneider
url: https://fredericgschneider.com
# Keep search engines off the preview until the domain switch (set false at launch).
noindex: true
role: Gulf economist · Senior Fellow, Middle East Council on Global Affairs
headline: Economic analysis of the Gulf’s post-oil transition.
bio: >-
  I work on Gulf and MENA economic policy: diversification, industrial policy, trade,
  labour markets and the energy transition. I write for leading think-tanks, advise
  government institutions in the UAE and Qatar, and comment regularly for the BBC,
  Al Jazeera, CNN and the Washington Post.
bio_academic: >-
  I hold a doctorate in economics from the University of Zurich and have held research
  positions at UC Berkeley, Yale and Cambridge. My academic work uses experimental and
  behavioural methods to study cooperation, trust and labour-market outcomes.
email: frederic@fredericgschneider.com
linkedin: https://www.linkedin.com/in/fredericgschneider/
cv: /static/files/cv-frederic-schneider.pdf
portrait: /static/img/portrait.jpg

# Outlets shown in the "As seen in" strip (in this order).
press: [New York Times, Washington Post, BBC, CNN, Al Jazeera, Bloomberg TV, DW, Euronews, The National]

# Topics: slug -> label. Items carry topic slugs in outputs.yaml.
topics:
  iran-war: War on Iran

# Topic spotlight shown on the homepage (null to hide).
spotlight:
  topic: iran-war
  blurb: >-
    Since February 2026 I have tracked the economic consequences of the U.S.–Israeli war on
    Iran for the Gulf and the world economy: Hormuz, oil and gas, food, finance, and the
    future of Gulf diversification.

